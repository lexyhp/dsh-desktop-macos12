name: Build DSH 2.0.17 for macOS 12 (experimental)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos12-dmg.yml'
      - 'scripts/patch_monterey.py'

permissions:
  contents: read

jobs:
  monterey-dmg:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout build instructions
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false

      - name: Checkout original DSH Desktop v2.0.17
        uses: actions/checkout@v4
        with:
          repository: anywhere-labs/dsh-desktop
          ref: v2.0.17
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Patch for macOS Monterey
        run: python3 kit/scripts/patch_monterey.py source

      - name: Install patched dependencies
        working-directory: source
        run: |
          corepack enable
          yarn install --no-immutable
          node -e "const p=require('./dsh-plugin-desktop/package.json'); if(p.devDependencies.electron!=='43.0.0'||p.build.mac.minimumSystemVersion!=='12.0.0')process.exit(1)"

      - name: Build desktop
        working-directory: source
        run: |
          yarn workspace dsh-community-market build
          yarn workspace dsh-plugin-desktop build

      - name: Pre-download Electron 43.0.0 archives with mirror fallback
        shell: bash
        run: |
          set -euo pipefail
          CACHE_ROOT="$RUNNER_TEMP/dsh-electron-cache"
          mkdir -p "$CACHE_ROOT"
          echo "ELECTRON_CACHE=$CACHE_ROOT" >> "$GITHUB_ENV"
          VERSION="43.0.0"
          OFFICIAL="https://github.com/electron/electron/releases/download/v${VERSION}"
          MIRROR="https://npmmirror.com/mirrors/electron/v${VERSION}"
          for ARCH in x64 arm64; do
            FILE="electron-v${VERSION}-darwin-${ARCH}.zip"
            TEMP="$RUNNER_TEMP/${FILE}"
            FOUND=0
            for BASE in "$OFFICIAL" "$MIRROR"; do
              echo "Fetching ${FILE} from ${BASE}"
              if curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 --silent --show-error "${BASE}/${FILE}" -o "$TEMP" && unzip -tq "$TEMP" >/dev/null 2>&1; then
                FOUND=1
                break
              fi
              rm -f "$TEMP"
            done
            if [ "$FOUND" -ne 1 ]; then
              echo "::error::Unable to download valid ${FILE} from GitHub or fallback mirror"
              exit 1
            fi
            # @electron/get hashes the official release URL's directory as its cache key.
            CACHE_HASH=$(printf '%s' "$OFFICIAL" | shasum -a 256 | awk '{print $1}')
            mkdir -p "$CACHE_ROOT/$CACHE_HASH"
            mv "$TEMP" "$CACHE_ROOT/$CACHE_HASH/$FILE"
            echo "Cached ${FILE} for electron-builder"
          done

      - name: Package unsigned Universal DMG
        working-directory: source
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_MAC_SMOKE_ARCH: universal
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          set -uo pipefail
          # Some GitHub-hosted downloads intermittently return HTTP 504.
          # Retry the complete packaging smoke without weakening verification.
          for attempt in 1 2 3; do
            echo "::group::Packaging attempt ${attempt}/3"
            if yarn workspace dsh-plugin-desktop dist:mac-smoke; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::DMG packaging failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify minimum macOS version
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find dsh-plugin-desktop/dist/mac-smoke -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG"
          mkdir -p /tmp/dsh-monterey-mounted
          hdiutil attach "$DMG" -mountpoint /tmp/dsh-monterey-mounted -nobrowse -readonly
          trap 'hdiutil detach /tmp/dsh-monterey-mounted || true' EXIT
          PLIST='/tmp/dsh-monterey-mounted/DSH Desktop.app/Contents/Info.plist'
          MIN_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")
          test "$MIN_VERSION" = "12.0.0"
          lipo -verify_arch x86_64 arm64 '/tmp/dsh-monterey-mounted/DSH Desktop.app/Contents/MacOS/DSH Desktop'

      - name: Upload experimental DMG
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-2.0.17-macOS12-universal-UNSIGNED
          path: source/dsh-plugin-desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error
          retention-days: 7

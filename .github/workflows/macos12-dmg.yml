name: Build DSH 2.0.17 for macOS 12 (experimental)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos12-dmg.yml'
      - 'scripts/patch_monterey.py'

permissions:
  contents: read

jobs:
  monterey-dmg:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout build instructions
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false

      - name: Checkout original DSH Desktop v2.0.17
        uses: actions/checkout@v4
        with:
          repository: anywhere-labs/dsh-desktop
          ref: v2.0.17
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Patch for macOS Monterey
        run: python3 kit/scripts/patch_monterey.py source

      - name: Install patched dependencies
        working-directory: source
        run: |
          corepack enable
          yarn install --no-immutable
          node -e "const p=require('./dsh-plugin-desktop/package.json'); if(p.devDependencies.electron!=='43.0.0'||p.build.mac.minimumSystemVersion!=='12.0.0')process.exit(1)"

      - name: Build desktop
        working-directory: source
        run: |
          yarn workspace dsh-community-market build
          yarn workspace dsh-plugin-desktop build

      - name: Verify and stage local Electron 43.0.0 distributions
        shell: bash
        run: |
          set -euo pipefail
          VERSION=43.0.0
          DIST="$GITHUB_WORKSPACE/source/dsh-plugin-desktop/.electron-dist"
          mkdir -p "$DIST"
          OFFICIAL="https://github.com/electron/electron/releases/download/v${VERSION}"
          MIRROR="https://npmmirror.com/mirrors/electron/v${VERSION}"
          for ARCH in x64 arm64; do
            FILE="electron-v${VERSION}-darwin-${ARCH}.zip"
            VERIFIED=0
            for BASE in "$OFFICIAL" "$MIRROR"; do
              echo "Checking ${FILE} from ${BASE}"
              MANIFEST="$RUNNER_TEMP/SHASUMS-${ARCH}.txt"
              ZIP="$DIST/$FILE"
              rm -f "$ZIP" "$MANIFEST"
              if ! curl -fLsS --retry 3 --retry-all-errors --retry-delay 4 --connect-timeout 25 --max-time 240 "${BASE}/SHASUMS256.txt" -o "$MANIFEST"; then
                continue
              fi
              # Electron manifests may prefix filenames with '*' (binary checksums).
              EXPECTED=$(awk -v file="$FILE" '{n=$2; if (substr(n,1,1)=="*") n=substr(n,2); if (substr(n,1,2)=="./") n=substr(n,3); if (n==file) {print $1; exit}}' "$MANIFEST")
              if ! [[ "$EXPECTED" =~ ^[0-9a-fA-F]{64}$ ]]; then
                echo "Manifest entry invalid for ${FILE}"
                continue
              fi
              if ! curl -fLsS --retry 3 --retry-all-errors --retry-delay 4 --connect-timeout 25 --max-time 600 "${BASE}/${FILE}" -o "$ZIP"; then
                continue
              fi
              ACTUAL=$(shasum -a 256 "$ZIP" | awk '{print $1}')
              if [ "$ACTUAL" = "$EXPECTED" ] && unzip -tq "$ZIP" >/dev/null 2>&1; then
                VERIFIED=1
                echo "Verified ${FILE} SHA256: ${ACTUAL}"
                break
              fi
              echo "Checksum or ZIP validation failed for ${FILE} from ${BASE}"
            done
            if [ "$VERIFIED" -ne 1 ]; then
              echo "::error::No validated Electron distribution found for ${ARCH}"
              exit 1
            fi
          done
          # electronDist accepts a directory of appropriately named ZIP files,
          # bypassing @electron/get entirely at packaging time.
          node - "$DIST" <<'NODE'
          const fs = require('node:fs');
          const path = 'source/dsh-plugin-desktop/package.json';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.build.electronDist = process.argv[2];
          delete cfg.build.electronDownload;
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          console.log('Using verified offline Electron distribution:', cfg.build.electronDist);
          NODE

      - name: Package unsigned Universal DMG
        working-directory: source
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_MAC_SMOKE_ARCH: universal
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          set -uo pipefail
          # Some GitHub-hosted downloads intermittently return HTTP 504.
          # Retry the complete packaging smoke without weakening verification.
          for attempt in 1 2 3; do
            echo "::group::Packaging attempt ${attempt}/3"
            if yarn workspace dsh-plugin-desktop dist:mac-smoke; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::DMG packaging failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify minimum macOS version
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find dsh-plugin-desktop/dist/mac-smoke -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG"
          mkdir -p /tmp/dsh-monterey-mounted
          hdiutil attach "$DMG" -mountpoint /tmp/dsh-monterey-mounted -nobrowse -readonly
          trap 'hdiutil detach /tmp/dsh-monterey-mounted || true' EXIT
          PLIST='/tmp/dsh-monterey-mounted/DSH Desktop.app/Contents/Info.plist'
          MIN_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")
          test "$MIN_VERSION" = "12.0.0"
          lipo -verify_arch x86_64 arm64 '/tmp/dsh-monterey-mounted/DSH Desktop.app/Contents/MacOS/DSH Desktop'

      - name: Upload experimental DMG
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-2.0.17-macOS12-universal-UNSIGNED
          path: source/dsh-plugin-desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error
          retention-days: 7
